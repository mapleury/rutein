<svg width="220" height="50" viewBox="0 0 220 50" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shineLic" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clipLic">
      <rect x="1" y="1" width="218" height="48" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="218" height="48" rx="10" ry="10" fill="#000000" stroke="#ffffff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="218" height="48" rx="10" ry="10" fill="url(#shineLic)" clip-path="url(#clipLic)"/>

  <text x="110" y="30" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">📄 MIT LICENSE</text>
</svg>
