<svg width="180" height="46" viewBox="0 0 180 46" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shineDemo" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clipDemo">
      <rect x="1" y="1" width="178" height="44" rx="9" ry="9"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="178" height="44" rx="9" ry="9" fill="#DA362A" stroke="#ffffff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="178" height="44" rx="9" ry="9" fill="url(#shineDemo)" clip-path="url(#clipDemo)"/>

  <text x="90" y="28" font-family="Verdana, Arial, sans-serif" font-size="12.5" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="0.5">🚀 LIVE DEMO</text>
</svg>
