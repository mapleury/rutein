<svg width="150" height="42" viewBox="0 0 150 42" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shineTut" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clipTut">
      <rect x="1" y="1" width="148" height="40" rx="8" ry="8"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="148" height="40" rx="8" ry="8" fill="#DA362A" stroke="#ffffff" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="148" height="40" rx="8" ry="8" fill="url(#shineTut)" clip-path="url(#clipTut)"/>

  <text x="75" y="26" font-family="Verdana, Arial, sans-serif" font-size="10" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="0.2">📖 TUTORIAL</text>
</svg>
